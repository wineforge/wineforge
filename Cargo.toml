[workspace]
members = [
    "crates/wineforge-core",
    "crates/wineforge-cli",
    "crates/wineforge-mcp-bridge",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wineforge/wineforge"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
icns = "=0.3.1"
ico = "=0.4.0"
pelite = "0.10"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.20"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"
toml = "0.8"
url = { version = "2.5", features = ["serde"] }
wineforge-core = { path = "crates/wineforge-core", version = "0.3.0" }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
