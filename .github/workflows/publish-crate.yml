name: Publish crate

on:
  workflow_dispatch:
    inputs:
      package:
        description: Crate to publish; publish core before CLI for each version
        required: true
        type: choice
        options:
          - wineforge-core
          - wineforge-cli

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - name: Verify publishable package
        run: cargo +1.85.0 publish --locked --dry-run -p "${{ inputs.package }}"
      - name: Publish selected crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +1.85.0 publish --locked -p "${{ inputs.package }}"
