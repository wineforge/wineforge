name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-bridge:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build statically linked Windows bridge
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo +1.85.0 build --locked --release -p wineforge-mcp-bridge
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wineforge-mcp-bridge-windows
          path: target/release/wineforge-mcp-bridge.exe
          if-no-files-found: error

  build:
    needs: windows-bridge
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.85.0 --profile minimal --target "${{ matrix.target }}"
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(cargo +1.85.0 metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "wineforge-cli") | .version')
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build release binaries
        run: cargo +1.85.0 build --locked --release --target "${{ matrix.target }}" -p wineforge-cli --bins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wineforge-mcp-bridge-windows
          path: package
      - name: Create cargo-binstall archive
        env:
          TARGET: ${{ matrix.target }}
          COPYFILE_DISABLE: "1"
        run: |
          mkdir -p package
          cp "target/$TARGET/release/wineforge" package/
          cp "target/$TARGET/release/wineforge-launcher" package/
          if [[ "$TARGET" == *-apple-darwin ]]; then
            codesign --force --sign - package/wineforge
            codesign --force --sign - package/wineforge-launcher
          fi
          tar -C package -czf "wineforge-cli-$TARGET.tar.gz" wineforge wineforge-launcher wineforge-mcp-bridge.exe
          shasum -a 256 "wineforge-cli-$TARGET.tar.gz" > "wineforge-cli-$TARGET.tar.gz.sha256"
      - name: Stage SBOM inputs
        run: |
          mkdir -p sbom-input
          cp Cargo.lock sbom-input/
          cp package/wineforge package/wineforge-launcher sbom-input/
          cp package/wineforge-mcp-bridge.exe sbom-input/
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: sbom-input
          format: spdx-json
          output-file: wineforge-cli-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Validate SPDX document
        env:
          TARGET: ${{ matrix.target }}
        run: |
          jq -e '.spdxVersion == "SPDX-2.3" and .SPDXID == "SPDXRef-DOCUMENT" and (.packages | length > 0)' \
            "wineforge-cli-$TARGET.spdx.json" > /dev/null
          shasum -a 256 "wineforge-cli-$TARGET.spdx.json" > "wineforge-cli-$TARGET.spdx.json.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wineforge-cli-${{ matrix.target }}
          path: |
            wineforge-cli-${{ matrix.target }}.tar.gz
            wineforge-cli-${{ matrix.target }}.tar.gz.sha256
            wineforge-cli-${{ matrix.target }}.spdx.json
            wineforge-cli-${{ matrix.target }}.spdx.json.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wineforge-cli-*
          path: release-assets
          merge-multiple: true
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'release already exists; refusing overwrite: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "Wineforge $RELEASE_TAG"
