name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.85.0 fmt --all --check
      - run: cargo +1.85.0 clippy --workspace --all-targets -- -D warnings
      - run: cargo +1.85.0 test --workspace

  windows-bridge:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.85.0 test --locked -p wineforge-mcp-bridge
      - run: cargo +1.85.0 clippy --locked -p wineforge-mcp-bridge --all-targets -- -D warnings
